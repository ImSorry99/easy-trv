    <rect x="60" y="104" width="24" height="114" rx="12"/>
    <rect x="94" y="104" width="24" height="114" rx="12"/>
    <rect x="128" y="104" width="24" height="114" rx="12"/>
    <rect x="162" y="104" width="24" height="114" rx="12"/>
