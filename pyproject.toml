[project]
name = "easy-trv"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.372",
    "ruff==0.14.*",
    "mypy==1.19.*",
    "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --cov=custom_components.easy_trv --cov-report=term-missing"

[tool.mypy]
strict = true
explicit_package_bases = true
files = [
    "custom_components/easy_trv/core",
    "custom_components/easy_trv/profiles",
    "custom_components/easy_trv/adapters",
]
ignore_missing_imports = true
